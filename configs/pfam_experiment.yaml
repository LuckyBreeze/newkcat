# Isolated optimization experiment based on exp/pfam-random-set.
# Paths are resolved against the current working directory.
# This branch never changes the original model or the original CSV splits.
data:
  train_csv: data/pfam/train.csv
  valid_csv: data/pfam/valid.csv
  test_csv: data/pfam/test.csv
  hits_csv: data/pfam/pfam_hits.csv
  features_npz: data/pfam/features.npz
  deepbgc_vectors: data/pfam/pfam2vec.csv.gz

model:
  source: random
  variant: set
  nmax_quantile: 0.99
  nmax_cap: 32
  min_train_pfam_fraction: 0.90
  transformer_layers: 1
  dropout: 0.1       # Existing Transformer dropout, explicitly retained
  fc_dropout: 0.1    # NEW: after Pfam Flatten -> FC -> LN -> ReLU
  init_scheme: xavier

training:
  seed: 668
  batch_size: 8
  epochs: 50
  patience: 30
  min_delta: 0.0001
  lr: 0.00005
  weight_decay: 0.001  # AdamW decoupled weight decay; 1-D bias/norm excluded
  warmup_epochs: 3
  min_lr_ratio: 0.1    # cosine final LR = 5e-6 if full 50 epochs run
  grad_clip: 5.0
  device: auto
