[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newkcat"
version = "0.1.0"
description = "Controlled substrate-graph and reaction-sequence replacements for CataPro"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "torch>=2.7,<3",
    "rdkit>=2024.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
catapro = ["pandas>=2.0"]
sequence = ["sr-smiles==0.2.0"]

[project.scripts]
newkcat = "newkcat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
