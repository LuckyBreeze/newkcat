name: Reaction readout controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Readout tests and CLI smoke
        run: |
          ruff check src/newkcat/readout src/newkcat/sequence examples/make_readout_demo.py tests/test_readout_*.py
          pytest -q tests/test_readout_*.py
          python examples/make_readout_demo.py
          python -m newkcat.readout inspect-model --config configs/readout/r_protein1024.yaml
          for mode in r0 protein1024 queries_full fusion flatten; do
            python -m newkcat.readout validate --config runs/readout_demo/$mode.yaml
            python -m newkcat.readout train --config runs/readout_demo/$mode.yaml
            python -m newkcat.readout evaluate --config runs/readout_demo/$mode.yaml --checkpoint runs/readout_demo/models/$mode/best.pt --split test --output runs/readout_demo/evaluate_$mode
          done
          python -m newkcat.readout audit --samples runs/readout_demo/data/samples.csv --split test --prediction R0=runs/readout_demo/evaluate_r0/predictions.csv --prediction Q=runs/readout_demo/evaluate_queries_full/predictions.csv --output runs/readout_demo/audit
